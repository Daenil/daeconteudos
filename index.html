<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Cortes</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0d12;
  }
  iframe {
    width: 100%;
    height: var(--visible-height, 100vh);
    height: 100dvh;
    border: none;
    display: block;
  }
</style>
<script>
  (function () {
    var frame = document.querySelector('iframe');
    function fitFrameToVisibleViewport() {
      var height = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;
      frame.style.height = height + 'px';
    }
    fitFrameToVisibleViewport();
    window.addEventListener('resize', fitFrameToVisibleViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitFrameToVisibleViewport);
      window.visualViewport.addEventListener('scroll', fitFrameToVisibleViewport);
    }
  })();
</script>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyLW_ecNe5PatVRYRoss_nYz2m-dhsgWkFhyMNxd7D_zffN8-LIoj6aghw08hx3wz81/exec"
    title="Painel de Cortes"
    allow="clipboard-write">
  </iframe>
</body>
</html>
